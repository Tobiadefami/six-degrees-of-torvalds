version: "3.8"

services:
  backend:
    image: tobiadefami/six-degrees-of-torvalds-backend:v2.0
    build: ./sixdegrees
    volumes:
      - ./sixdegrees:/app/sixdegrees
    environment:
      - GITHUB_APP_CLIENT_ID=${GITHUB_APP_CLIENT_ID}
      - GITHUB_APP_CLIENT_SECRET=${GITHUB_APP_CLIENT_SECRET}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - SIX_DEGREES_ENVIRONMENT=${SIX_DEGREES_ENVIRONMENT}
      - SECRET_KEY=${SECRET_KEY}
      - NGINX_HOST=${NGINX_HOST}
    network_mode: host

  frontend:
    image: tobiadefami/six-degrees-of-torvalds-frontend:v2.0
    build: ./sixdegrees_frontend
    volumes:
      - ./sixdegrees_frontend:/app

    command: npm run dev
    network_mode: host

  nginx:
    image: tobiadefami/six-degrees-of-torvalds-nginx:v2.0
    build: ./nginx
    volumes:
      - ./nginx/default.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro

    depends_on:
      - backend
      - frontend

    network_mode: host
